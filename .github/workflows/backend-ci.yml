name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: survey_user
          POSTGRES_PASSWORD: survey_pass
          POSTGRES_DB: site_survey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U survey_user -d site_survey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: site_survey
          DB_USER: survey_user
          DB_PASSWORD: survey_pass
        run: npm test -- --runInBand
